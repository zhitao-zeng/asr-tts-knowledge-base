name: validate

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  quality-gate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      # 质检门禁：校验 insight 无退化（56 模型全覆盖、每篇 3 条、q 无 ** / 无参考文献、
      # 闭源推导注带规定前缀）。注意：不拉取 Git LFS（校验只需 index.html）。
      - name: Run insight quality gate
        run: node tools/validate.js
      # 论文全文双语精读门禁：data/papers/*.js 的翻译覆盖、锚点有效性、
      # 数字/引用一致性（data/papers/ 为空时自动跳过）。
      - name: Run paper-reader quality gate
        run: node tools/validate_paper.js
      # SEO 产物门禁：data/kb.js 是唯一事实来源，index.html/models.html/sitemap.xml/robots.txt
      # 以及 models/<id>/index.html 静态详情页必须由其重新生成并随仓库提交；
      # 若提交遗漏 regeneration，则 diff 非空、本步失败（git add -N 让未跟踪的新页面也进入 diff）。
      - name: Regenerate SEO artifacts
        run: node tools/gen_seo.js
      - name: Ensure generated files are up to date
        run: |
          git add -N index.html models.html sitemap.xml robots.txt models/ || true
          git diff --exit-code -- index.html models.html sitemap.xml robots.txt models/
