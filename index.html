<style>

  *{box-sizing:border-box}
  body{margin:0;font-family:"PingFang SC","Microsoft YaHei",system-ui,-apple-system,Segoe UI,Roboto,sans-serif;

       border-bottom:1px solid var(--line)}

  .brand{font-weight:800;font-size:17px;margin-right:10px;letter-spacing:.3px}
  .brand .dot{color:var(--brand)}
  .nav a{text-decoration:none;color:var(--muted);padding:7px 12px;border-radius:9px;font-weight:600;font-size:14px}
  .nav a:hover{background:var(--chip);color:var(--brand)}
  .nav a.active{background:var(--brand);color:#fff}
  .nav .spacer{flex:1}
  main{max-width:1180px;margin:0 auto;padding:22px 18px 60px}
  h1{font-size:26px;margin:6px 0 4px}
  h2{font-size:20px;margin:24px 0 10px}
  h3{font-size:16px;margin:18px 0 8px}
  p{margin:8px 0}
  a.link{color:var(--brand);text-decoration:none}
  a.link:hover{text-decoration:underline}
  .muted{color:var(--muted)}
  .card{background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:16px 18px;box-shadow:var(--shadow)}
  .grid{display:grid;gap:14px}
  .g2{grid-template-columns:repeat(2,1fr)}
  .g3{grid-template-columns:repeat(3,1fr)}
  .g4{grid-template-columns:repeat(4,1fr)}
  @media(max-width:880px){.g2,.g3,.g4{grid-template-columns:1fr}}
  .tag{display:inline-block;font-size:12px;padding:2px 9px;border-radius:999px;background:var(--chip);color:#374151;margin:2px 4px 2px 0;font-weight:600}
  .tag.asr{background:#dbeafe;color:#1e40af}
  .tag.tts{background:#fce7f3;color:#9d174d}
  .tag.warn{background:#fef3c7;color:#92400e}
  .tag.ok{background:#dcfce7;color:#166534}
  .pill{font-size:11px;padding:1px 7px;border-radius:6px;font-weight:700}
  .pill.paper{background:#dcfce7;color:#166534}
  .pill.blog{background:#fef3c7;color:#92400e}
  .pill.rank{background:#e0e7ff;color:#3730a3}
  .pill.comm{background:#fee2e2;color:#991b1b}
  .pill.role{background:#e2e8f0;color:#334155}

  .model-card h3{margin:0 0 4px;font-size:16px}
  .model-card .org{color:var(--muted);font-size:13px}
  .model-card .sum{font-size:13.5px;color:#374151;margin-top:6px}

  .kv .k{color:var(--muted);font-weight:600}

  .sec .h.warnc{color:var(--warn);border-color:var(--warn)}

  .ins-nav a{flex:1;text-decoration:none;color:#4338ca;background:#f5f3ff;border:1px solid #ddd6fe;border-radius:10px;padding:9px 12px;font-size:13px;transition:.15s}
  .ins-nav a:hover{background:#ede9fe}
  .ins-nav a.next{text-align:right}

  .deep p{margin:6px 0;line-height:1.65}
  .deep code{background:#f1f5f9;padding:1px 5px;border-radius:5px;font-size:12.5px;color:#0f172a}
  .deep b{color:#0f172a}
  .critique{border-left:3px solid var(--warn);background:#fffbeb;padding:8px 12px;margin:8px 0;border-radius:0 8px 8px 0;font-size:13.5px}
  ul.tight{margin:6px 0;padding-left:20px}
  ul.tight li{margin:4px 0}
  .diff{border-left:3px solid var(--accent);padding:6px 12px;margin:8px 0;background:#f0fdfa;border-radius:0 8px 8px 0}
  .diff b{color:#0f766e}

  .filters label{font-size:12px;color:var(--muted);display:block;font-weight:600;margin-bottom:3px}
  select,input[type=text]{font:inherit;padding:7px 10px;border:1px solid var(--line);border-radius:9px;background:#fff;color:var(--ink)}
  table{border-collapse:collapse;width:100%;font-size:13.5px;background:#fff;border-radius:12px;overflow:hidden;box-shadow:var(--shadow)}
  th,td{border-bottom:1px solid var(--line);padding:9px 10px;text-align:left;vertical-align:top}
  th{background:#f1f5f9;font-weight:700;cursor:pointer;user-select:none;position:sticky;top:0}
  th:hover{color:var(--brand)}
  tr:hover td{background:#f8fafc}
  .num{font-variant-numeric:tabular-nums;text-align:right}
  .note{background:#fffbeb;border:1px solid #fde68a;border-radius:10px;padding:10px 14px;color:#92400e;font-size:13px;margin:14px 0}
  .legend{display:flex;gap:14px;flex-wrap:wrap;font-size:12.5px;color:var(--muted);margin:8px 0}
  .svgwrap{overflow:auto;border:1px solid var(--line);border-radius:12px;background:#fff;padding:8px;box-shadow:var(--shadow)}

<script src="data/kb.js"></script>
<script>
/* ============================================================
   数据层（单文件内联，含多架构支持 + 论文精读字段）
   architecture / training / results / ablation / limitation = 深度字段
   ============================================================ */
/* ============================================================
   渲染引擎
   ============================================================ */
const $=s=>document.querySelector(s);
const app=$("#app");
const modelsById = Object.fromEntries(KB.models.map(m=>[m.id,m]));
const lineagesById = Object.fromEntries(KB.lineages.map(l=>[l.id,l]));
const esc=s=>(s==null?"":String(s)).replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
/* 行内 markdown：先转义 HTML，再解析 **粗体**；br=true 时把换行转成 <br> */
function mdInline(s,br){
  let h=esc(s==null?"":s);
  h=h.replace(/\*\*([^*]+?)\*\*/g,"<strong>$1</strong>");
  if(br) h=h.replace(/\n/g,"<br>");
  return h;
}
function srcPill(t){const m={论文:["paper","论文"],博客:["blog","博客"],榜单:["rank","榜单"],商业:["comm","商业"]};
  const [c,l]=m[t]||["blog",t];return `<span class="pill ${c}">${l}</span>`;}
function domTag(d){return d==="ASR"?'<span class="tag asr">ASR</span>':'<span class="tag tts">TTS</span>';}
function lineName(id){const l=lineagesById[id];return l?l.name:id;}
function wrapText(str,max){const out=[];let cur="";for(const ch of str){cur+=ch;if(cur.length>=max){out.push(cur);cur="";}}if(cur)out.push(cur);return out;}

/* 深度精读文本：支持 mini-markdown —— "## " 子标题、 "- " 要点、空行分段 */
function renderDeep(t){
  if(!t) return "";
  const lines=esc(t).split("\n");
  let html="", inUl=false;
  const closeUl=()=>{ if(inUl){html+="</ul>";inUl=false;} };
  for(const raw of lines){
    const line=raw.replace(/\s+$/,"");
    if(line===""){ closeUl(); continue; }
    if(line.startsWith("## ")){ closeUl(); html+=`<div class="sub">${mdInline(line.slice(3))}</div>`; continue; }
    if(line.startsWith("- ")){ if(!inUl){html+='<ul class="deep-ul">';inUl=true;} html+=`<li>${mdInline(line.slice(2))}</li>`; continue; }
    closeUl(); html+=`<p>${mdInline(line)}</p>`;
  }
  closeUl();
  return `<div class="deep">${html}</div>`;
}
/* 深度字段优先取 DEEP[id][field]，否则用模型自带简短字段 */
function deep(id,field){
  const ov=(typeof DEEP!=="undefined"&&DEEP[id]&&DEEP[id][field]!=null)?DEEP[id][field]:null;
  return ov || modelsById[id][field] || "论文未详述。";
}

function router(){
  const h=location.hash||"#/";
  const parts=h.slice(2).split("/");
  const route=parts[0]||"";
  document.querySelectorAll(".nav a").forEach(a=>{
    const r=(a.getAttribute("href")||"").slice(2);
    a.classList.toggle("active", r===route || (route==="" && r===""));
  });
  if(route===""||route==="home") return renderHome();
  if(route==="models") return renderModels();
  if(route==="model") return renderModel(parts[1]);
  if(route==="lineage") return renderLineage(parts[1]||"ASR");
  if(route==="bench") return renderBench();
  if(route==="insights") return renderInsightsList();
  if(route==="insight") return renderInsight(parts[1]);
  if(route==="matrix") return renderMatrix();
  renderHome();
}
window.addEventListener("hashchange",router);

function renderHome(){
  const asr=KB.models.filter(m=>m.domain==="ASR").length;
  const tts=KB.models.filter(m=>m.domain==="TTS").length;
  const deep=KB.models.filter(m=>m.architecture&&m.training&&m.results).length;
  app.innerHTML=`
  <div class="hero">
    <h1>ASR / TTS 模型知识库 <span class="muted" style="font-size:15px">· 2026 前沿 + 近年代表作（含可下载 PDF 离线包）</span></h1>
    <p>近半年（2026.02–2026.08，含中文方言与经典基础论文）语音识别与合成代表模型的<strong>论文深度解读</strong>：每个模型点进去有
    <strong>架构细节 · 训练数据与目标 · 关键实验结果（带具体数字）· 消融与关键发现 · 局限与开放问题 · 与别家技术差异</strong>。
    多架构模型（FireRedASR2、StepAudio 2.5）挂多条主线并拆分架构变体。</p>
    <div class="stat">共 <b>${KB.models.length}</b> 个模型（ASR ${asr} · TTS ${tts}）｜ <b>${KB.lineages.length}</b> 条框架主线 ｜ 深度精读覆盖 <b>${deep}</b> 个 ｜ <b>${KB.models.filter(m=>m.pdf_local).length}</b> 篇论文已随包下载（断网可读）｜ 数据快照 2026-08-20</div>
  </div>
  <div class="grid g3" style="margin-top:16px">
    <a class="card model-card" href="#/models" style="text-decoration:none;color:inherit">
      <h3>📚 模型库</h3><div class="sum">${KB.models.length} 个模型卡片，含论文完整技术拆解。</div></a>
    <a class="card model-card" href="#/lineage" style="text-decoration:none;color:inherit">
      <h3>🧬 框架谱系</h3><div class="sum">ASR / TTS 各 4 条主线，SVG 标注每个模型「在哪里做了创新」。</div></a>
    <a class="card model-card" href="#/bench" style="text-decoration:none;color:inherit">
      <h3>📊 横评 Benchmark（按数据集）</h3><div class="sum">按数据集归集的对比：每个榜单下列出在该数据集上<strong>公开了具体数字</strong>的模型与数值（★ 为最优），未公开者单列「官方宣称」、不参与排序。</div></a>
    <a class="card model-card" href="#/insights" style="text-decoration:none;color:inherit">
      <h3>📝 论文逐句解读</h3><div class="sum">${Object.keys(INSIGHTS||{}).length} 篇旗舰论文的<strong>原句/论点 + Insight 旁注</strong>：逐句拆解设计动机、巧妙之处与可疑之处，支持上一篇/下一篇连续读。</div></a>
  </div>
  <div class="note">⚠️ 口径说明：HF Open ASR 榜偏英文 WER、Artificial Analysis 偏自然度盲评/词错率，各榜头部差距常 &lt; 1–2 点。部分工业模型仅发布页/榜单、无独立 arXiv 论文，已在卡片用来源标签标明（并标注「官方 / 链接待核实」）。少数 2025 年发表但 2026 上半年仍是主流参照的模型已标注。带 <span class="deep-badge">精读</span> 的字段均基于论文/官方技术报告的具体数字。<br>📦 <b>离线包</b>：本页已与 <code>papers/</code> 目录（收录的可下载 arXiv 原文 PDF）一同交付。卡片/详情页带 <span class="pill paper">📄 本地PDF</span> 的模型，可直接点开离线 PDF；无公开 PDF 的（闭源或仅发布页）已如实标注。 论文 PDF 均来自 arXiv（版权归原作者 / arXiv，本仓库仅作研究聚合托管，请遵守原许可）。</div>
  `;
}

let modelFilter={domain:"All",open:"All",paper:"All",q:""};

// 开放状态（由 license / source_type 启发式推导，粗粒度；精确标注待补 caps 字段）
function openStatus(m){
  const L=((m.license||"")+" "+(m.source_type||"")).toLowerCase();
  const open=/开源|apache|mit|cc-?by|研究|开放权重|权重已发布|已开源|fairseq|transformers|代码与权重|有限开放|iclr|公开/.test(L);
  const closed=/闭源|商业|未公开|受限|专有|技术报告/.test(L);
  if(open) return "Open";
  if(closed) return "Closed";
  return "Mixed";
}
// 论文状态（精确，来自字段）
function paperStatus(m){
  if(m.pdf_local) return "Local";
  if(m.paper_url) return "Online";
  return "None";
}
function renderModels(){
  const q=modelFilter.q.toLowerCase();
  let list=KB.models.filter(m=>{
    if(modelFilter.domain!=="All"&&m.domain!==modelFilter.domain)return false;
    if(modelFilter.open!=="All"&&openStatus(m)!==modelFilter.open)return false;
    if(modelFilter.paper!=="All"&&paperStatus(m)!==modelFilter.paper)return false;
    if(q&&!(m.name.toLowerCase().includes(q)||m.org.toLowerCase().includes(q)||m.summary.toLowerCase().includes(q)))return false;
    return true;
  });
  const cards=list.map(m=>`
    <a class="card model-card" href="#/model/${m.id}" style="text-decoration:none;color:inherit">
      <div style="display:flex;justify-content:space-between;align-items:baseline;gap:8px">
        <h3>${esc(m.name)}</h3>${srcPill(m.source_type)} ${m.role?`<span class="pill role">${esc({baseline:"经典基线",boundary:"边界参考",current:"当前主流"}[m.role]||m.role)}</span>`:''} ${m.pdf_local?'<span class="pill paper">PDF</span>':''}
      </div>
      <div class="org">${esc(m.org)} · ${esc(m.date)} · ${m.params}</div>
      <div class="sum">${esc(m.summary)}</div>
      <div style="margin-top:8px">${domTag(m.domain)}
        ${m.framework_lines.map(l=>`<span class="tag">${esc(lineName(l))}</span>`).join("")}
        ${m.architectures?'<span class="tag warn">多架构</span>':''}
      </div>
    </a>`).join("");
  app.innerHTML=`
    <a class="back" href="#/">← 返回概览</a>
    <h1>模型库</h1>
    <div class="filters">
      <div><label>领域</label>
        <select id="fDom"><option value="All">全部</option><option value="ASR">ASR</option><option value="TTS">TTS</option></select></div>
      <div><label>开放状态</label>
        <select id="fOpen"><option value="All">全部</option><option value="Open">开源可复现</option><option value="Closed">闭源商业</option><option value="Mixed">其他/混合</option></select></div>
      <div><label>论文</label>
        <select id="fPaper"><option value="All">全部</option><option value="Local">有本地PDF</option><option value="Online">仅在线链接</option><option value="None">无论文</option></select></div>
      <div><label>搜索</label>
        <input id="fQ" type="text" placeholder="模型 / 机构 / 关键词" style="width:220px"></div>
      <div class="stat" style="align-self:center">命中 <b>${list.length}</b> / ${KB.models.length}</div>
    </div>
    <div class="grid g2">${cards||'<p class="muted">无匹配。</p>'}</div>
  `;
  $("#fDom").value=modelFilter.domain;$("#fDom").onchange=e=>{modelFilter.domain=e.target.value;renderModels();};
  $("#fOpen").value=modelFilter.open;$("#fOpen").onchange=e=>{modelFilter.open=e.target.value;renderModels();};
  $("#fPaper").value=modelFilter.paper;$("#fPaper").onchange=e=>{modelFilter.paper=e.target.value;renderModels();};
  $("#fQ").value=modelFilter.q;$("#fQ").oninput=e=>{modelFilter.q=e.target.value;renderModels();};
}

/* ---------- 深度精读数据（由脚本注入；覆盖各模型的架构/训练/消融/局限字段） ---------- */
/* ===== 新增：近年代表性论文（可下载 PDF 离线精读） ===== */



/* ---------- 论文逐句解读 · Insight 旁注 ---------- */
function renderInsightsList(){
  const ids=Object.keys(typeof INSIGHTS!=="undefined"?INSIGHTS:{});
  const cards=ids.map(id=>{
    const m=modelsById[id]; if(!m) return "";
    const n=(INSIGHTS[id]||[]).length;
    return `<a class="card model-card" href="#/insight/${id}" style="text-decoration:none;color:inherit">
      <span class="tag ${m.domain==='ASR'?'asr':'tts'}">${m.domain}</span>
      <h3>${esc(m.name)}</h3>
      <div class="sum">${n} 条原句/论点 + Insight 旁注 · ${esc(m.org)}</div></a>`;
  }).join("");
  app.innerHTML=`
    <a class="back" href="#/">← 返回概览</a>
    <h1>论文逐句解读 · Insight 旁注</h1>
    <div class="note">📝 对每篇论文，抽出<strong>真实原句或核心论点</strong>（开源模型尽量抓 arXiv / 官方原文；闭源模型用业界公认架构事实推导并标注「推导」），每条配一段<strong>解读 / 批判 / 启发</strong>。点击进入单篇，可上一篇 / 下一篇连续读。</div>
    <div class="grid g3" style="margin-top:14px">${cards}</div>`;
}
function renderInsight(id){
  const m=modelsById[id];
  if(!m||!(typeof INSIGHTS!=="undefined"&&INSIGHTS[id])){
    app.innerHTML='<p>该模型暂无逐句解读。</p><a class="back" href="#/insights">← 论文列表</a>';return;
  }
  const ids=Object.keys(INSIGHTS);
  const idx=ids.indexOf(id);
  const prevId=idx>0?ids[idx-1]:null;
  const nextId=idx<ids.length-1?ids[idx+1]:null;
  const items=(INSIGHTS[id]||[]).map(it=>{
    const derived=/推导|推测/.test(it.src||"");
    return `<div class="insight-block">
      <div class="ins-src ${derived?'derived':''}">${esc(it.src||"来源未标")}</div>
      <div class="ins-quote">${mdInline(it.q,true)}</div>
      <div class="ins-body">${mdInline(it.insight,true)}</div>
    </div>`;
  }).join("");
  const prevNav=prevId?`<a class="prev" href="#/insight/${prevId}">← ${esc(modelsById[prevId].name)}</a>`:'<span></span>';
  const nextNav=nextId?`<a class="next" href="#/insight/${nextId}">${esc(modelsById[nextId].name)} →</a>`:'<span></span>';
  app.innerHTML=`
    <a class="back" href="#/insights">← 论文列表</a>
    <div class="ins-nav">${prevNav}${nextNav}</div>
    <div class="card">
      <div style="display:flex;justify-content:space-between;align-items:baseline;gap:10px;flex-wrap:wrap">
        <h1 style="margin:0">${esc(m.name)} <span class="muted" style="font-size:15px">· 论文逐句解读</span></h1>
        <div>${domTag(m.domain)} ${srcPill(m.source_type)}</div>
      </div>
      <div class="ins-paper-meta">${esc(m.org)} · ${esc(m.date)} · <a class="link" href="#/model/${id}">查看完整论文精读卡片 →</a></div>
      ${items}
    </div>
    <div class="ins-nav">${prevNav}${nextNav}</div>`;
  window.scrollTo(0,0);
}

function renderModel(id){
  const m=modelsById[id];
  if(!m){app.innerHTML='<p>未找到模型。</p><a class="back" href="#/models">← 模型库</a>';return;}
  const archHtml=(m.architectures||[]).map(a=>`

      <div style="margin-top:4px">${esc(a.innovation_point)}</div>
      ${a.metrics?`<div class="stat">指标：${Object.entries(a.metrics).map(([k,v])=>`${k}=${v}`).join("，")}</div>`:""}
    </div>`).join("");
  const diffHtml=(m.diff_vs||[]).map(d=>`<div class="diff"><b>vs ${esc(d.vs)}：</b>${esc(d.note)}</div>`).join("");
  const refHtml=(m.references||[]).map(r=>`<li><a class="link" href="${esc(r.url)}" target="_blank" rel="noopener">${esc(r.title)}</a></li>`).join("");
  const resHtml=(m.results&&m.results.length)?`<table class="rtable"><thead><tr><th>数据集 / 场景</th><th>指标</th><th>数值</th><th>说明</th></tr></thead><tbody>
    ${m.results.map(r=>`<tr><td>${esc(r.dataset)}</td><td>${esc(r.metric)}</td><td class="num">${esc(r.value)}</td><td class="muted">${esc(r.note||"")}</td></tr>`).join("")}</tbody></table>`:'<div class="stat">论文未给出统一数值表（以官方发布为准）</div>';
  const metr=Object.entries(m.metrics||{}).filter(([k,v])=>v!==undefined&&v!==null&&v!=="");
  const metrHtml=metr.length?`<div class="kv">${metr.map(([k,v])=>`<span class="k">${k}</span><span>${v}</span>`).join("")}</div>`:'<div class="stat">指标未公开（以官方发布为准）</div>';
  app.innerHTML=`
    <a class="back" href="#/models">← 模型库</a>
    <div class="card">
      <div style="display:flex;justify-content:space-between;align-items:baseline;gap:10px;flex-wrap:wrap">
        <h1 style="margin:0">${esc(m.name)}</h1>
        <div>${domTag(m.domain)} ${srcPill(m.source_type)} ${m.role?`<span class="pill role">${esc({baseline:"经典基线",boundary:"边界参考",current:"当前主流"}[m.role]||m.role)}</span>`:''} ${(m.pdf_local)?'<span class="pill paper">📄 本地PDF</span>':''}</div>
      </div>
      <div class="org" style="font-size:14px">${esc(m.org)} · ${esc(m.date)} · 参数量 ${esc(m.params)} · 许可 ${esc(m.license)}</div>
      <div class="sec"><div class="h">一句话</div><p>${esc(m.summary)}</p></div>
      <div class="sec"><div class="h">所属主线</div>
        ${m.framework_lines.map(l=>`<span class="tag ${m.domain==='ASR'?'asr':'tts'}">${esc(lineName(l))}</span>`).join(" ")}
        ${m.architectures?'<span class="tag warn">多架构模型</span>':''}
      </div>
      <div class="sec"><div class="h">关键指标</div>${metrHtml}</div>
      <div class="sec"><div class="h acc">架构细节 · 设计动机与机制</div>${renderDeep(deep(id,"architecture"))}</div>
      <div class="sec"><div class="h acc">训练数据与目标 · 配方</div>${renderDeep(deep(id,"training"))}</div>
      <div class="sec"><div class="h acc">关键实验结果 <span class="deep-badge">精读</span></div>${resHtml}</div>
      <div class="sec"><div class="h warnc">消融与关键发现</div>${renderDeep(deep(id,"ablation"))}</div>
      <div class="sec"><div class="h warnc">局限与开放问题 · 批判评估</div>${renderDeep(deep(id,"limitation"))}</div>
      <div class="sec"><div class="h">创新点</div><ul class="tight">${(m.innovation||[]).map(i=>`<li>${esc(i)}</li>`).join("")}</ul></div>
      ${archHtml?`<div class="sec"><div class="h">架构变体（多架构拆分）</div>${archHtml}</div>`:""}
      <div class="sec"><div class="h">与别家技术差异</div>${diffHtml}</div>
      ${refHtml?`<div class="sec"><div class="h">参考来源</div><ul class="tight">${refHtml}</ul></div>`:""}
      ${(m.pdf_local||m.paper_url)?`<div class="sec"><div class="h">论文 / 来源</div>${m.pdf_local?`<p><a class="link" href="${esc(m.pdf_local)}" target="_blank" rel="noopener">📄 打开已下载的本地 PDF</a></p><p class="muted" style="font-size:12px">文件已随本知识库保存于 <code>papers/</code> 目录，断网也可直接打开。</p>`:''}${m.paper_url?`<p><a class="link" href="${esc(m.paper_url)}" target="_blank" rel="noopener">🔗 在线来源${/arxiv/.test(m.paper_url)?'（arXiv 摘要页）':''}</a></p><p class="muted" style="font-size:12px">PDF 已随仓库直接托管（非 LFS），克隆即离线可读；线上站点亦可直接打开 arXiv 原文。</p>`:''}</div>`:""}
      ${(typeof INSIGHTS!=="undefined"&&INSIGHTS[id])?`<div class="sec"><div class="h">论文逐句解读 · Insight 旁注</div><p><a class="link" href="#/insight/${id}">打开逐句解读 →</a>（${INSIGHTS[id].length} 条原句/论点 + 解读）</p></div>`:""}
    </div>
    <p class="src-note">来源类型：${esc(m.source_type)} ${m.has_arxiv?"· 含 arXiv 论文":""} ${(m.pdf_local)?"· 已下载本地 PDF":""}</p>
  `;
  window.scrollTo(0,0);
}

/* ---------- 框架谱系 ---------- */
function lineageSVG(L){
  const W=760, rowH=78, baseY=46, baseX=16, baseW=190, baseH=46;
  const members=L.members;
  const H=Math.max(170, baseY+baseH+30+members.length*rowH+20);
  const memX=440, memW=300, memH=50;
  let edges="", nodes="";
  members.forEach((mb,i)=>{
    const y=baseY+baseH+30+i*rowH;
    const my=y+memH/2, by=baseY+baseH/2;
    edges+=`<path d="M ${baseX+baseW} ${by} C ${(baseX+baseW+memX)/2} ${by}, ${(baseX+baseW+memX)/2} ${my}, ${memX} ${my}" stroke="#cbd5e1" stroke-width="2" fill="none"/>`;
    const mdl=modelsById[mb.model_id];if(!mdl)return;
    const col=mdl.domain==="ASR"?"#1e40af":"#9d174d";
    const lines=wrapText(mb.innovation_point,18);
    const tspan=lines.map((ln,k)=>`<tspan x="${memX+12}" dy="${k===0?0:16}">${esc(ln)}</tspan>`).join("");
    nodes+=`<g>
      <rect x="${memX}" y="${y}" width="${memW}" height="${memH}" rx="10" fill="#fff" stroke="${col}" stroke-width="2"/>
      <text x="${memX+12}" y="${y+20}" font-size="14" font-weight="800" fill="${col}">${esc(mdl.name)}${mb.variant?' <tspan font-size="11" fill="#92400e">('+esc(mb.variant)+')</tspan>':''}</text>
      <text x="${memX+12}" y="${y+38}" font-size="11.5" fill="#475569">${tspan}</text>
      <title>${esc(mdl.name)}｜${esc(mb.innovation_point)}</title>
      <a href="#/model/${mdl.id}"><rect x="${memX}" y="${y}" width="${memW}" height="${memH}" rx="10" fill="transparent" style="cursor:pointer"/></a>
    </g>`;
  });
  const baseNode=`<g><rect x="${baseX}" y="${baseY}" width="${baseW}" height="${baseH}" rx="10" fill="#0f172a"/>
    <text x="${baseX+baseW/2}" y="${baseY+19}" font-size="13" font-weight="800" fill="#fff" text-anchor="middle">基线</text>
    <text x="${baseX+baseW/2}" y="${baseY+37}" font-size="10.5" fill="#cbd5e1" text-anchor="middle">${esc(L.baseline)}</text></g>`;
  return `<svg viewBox="0 0 ${W} ${H}" width="100%" style="min-width:680px">${edges}${baseNode}${nodes}</svg>`;
}
function renderLineage(domain){
  domain=domain||"ASR";
  const ls=KB.lineages.filter(l=>l.domain===domain);
  const cards=ls.map(L=>`
    <div class="lineage-card card">
      <div class="lh">${domTag(L.domain)} ${esc(L.name)}</div>
      <div class="lb">基线：${esc(L.baseline)} ｜ 成员 ${L.members.length}</div>
      <div class="svgwrap">${lineageSVG(L)}</div>
    </div>`).join("");
  app.innerHTML=`
    <a class="back" href="#/">← 返回概览</a>
    <h1>框架谱系</h1>
    <div class="filters"><div><label>领域</label>
      <select id="lDom"><option value="ASR">ASR（识别）</option><option value="TTS">TTS（合成）</option></select></div></div>
    <div class="note">说明：纵向为「基线 → 各成员」，每个成员框标注<strong>它在该主线上的创新点</strong>；<strong>多架构模型会在多条主线上各出现一次</strong>（如 FireRedASR2 在 AED/LLM/长音频三线、StepAudio 2.5 在 ASR-LLM/TTS-混合两线）。点击节点可跳到模型详情。</div>
    ${cards}
  `;
  $("#lDom").value=domain;$("#lDom").onchange=e=>{location.hash="#/lineage/"+e.target.value;};
}

/* ---------- 横评 Benchmark（按数据集） ---------- */
/* 规范化基准：每个数据集归集"在该数据集上公开了数字"的模型，并给出具体数值。
   entries: {id:模型id, v:数值(null=无统一数字), q:是否官方宣称(无统一数字), note, approx} */
let benchState={domain:"All",onlyNum:false};
function modelName(id){const m=KB.models.find(x=>x.id===id);return m?m.name:id;}
function renderBench(){
  let list=BENCHMARKS.filter(b=>benchState.domain==="All"||b.domain===benchState.domain);
  if(benchState.onlyNum) list=list.filter(b=>b.entries.some(e=>e.v!=null));
  const cards=list.map(b=>{
    const numeric=b.entries.filter(e=>e.v!=null);
    const qual=b.entries.filter(e=>e.v==null);
    let best=null;
    if(numeric.length>=2){ best=(b.better==="lower")?Math.min(...numeric.map(e=>e.v)):(b.better==="higher")?Math.max(...numeric.map(e=>e.v)):null; }
    const maxV=numeric.length?Math.max(...numeric.map(e=>e.v)):1;
    const span=(maxV-Math.min(...numeric.map(e=>e.v)))||1;
    const rows=numeric.slice().sort((x,y)=> (b.better==="lower")? x.v-y.v : y.v-x.v).map(e=>{
      const isBest=(best!=null)&&(numeric.length>=2)&&(e.v===best);
      let goodness = (b.better==="higher") ? (maxV? e.v/maxV : 1) : (span? (maxV-e.v)/span : 1);
      const w=Math.max(6,goodness*100);
      const valTxt=(e.approx?"~":"")+e.v+(b.unit||"");
      return `<div class="bar-row">
        <div class="bar-name" title="${esc(modelName(e.id))}"><a class="link" href="#/model/${e.id}">${esc(modelName(e.id))}</a>${isBest?'<span class="best-star">★</span>':''}</div>
        <div class="bar-track"><div class="bar-fill" style="width:${w}%;${isBest?'background:linear-gradient(90deg,#059669,#10b981)':''}"></div></div>
        <div class="bar-val">${valTxt}</div></div>`;
    }).join("");
    const qtags=qual.map(q=>`<span class="qtag"><a class="link" href="#/model/${q.id}">${esc(modelName(q.id))}</a>：${esc(q.note)}</span>`).join("");
    const dirCls={lower:"dir-lower",higher:"dir-higher",rank:"dir-rank"}[b.better]||"dir-rank";
    const dirText={lower:"越低越好",higher:"越高越好",rank:"官方宣称"}[b.better]||"官方宣称";
    return `<div class="bench-card">
      <h3>${esc(b.name)}<span class="bench-dir ${dirCls}">${dirText}</span></h3>
      <div class="bench-meta">${b.domain} · 指标 ${esc(b.metric)}${b.unit?(" ("+b.unit+")"):""} · ${numeric.length>=2? numeric.length+" 个模型有公开数字（★ 为该数据集最优）" : "已收录 "+numeric.length+" 个结果（暂无同口径对比，不排名）"}</div>
      ${rows||'<p class="muted">该数据集暂无公开统一数字。</p>'}
      ${qtags?`<div class="qline">${qtags}</div>`:""}
    </div>`;
  }).join("");
  app.innerHTML=`
    <a class="back" href="#/">← 返回概览</a>
    <h1>横评 Benchmark（按数据集）</h1>
    <div class="filters">
      <div><label>领域</label><select id="bDom"><option value="All">全部</option><option value="ASR">ASR</option><option value="TTS">TTS</option></select></div>
      <div style="display:flex;align-items:flex-end"><label style="display:flex;gap:6px;align-items:center;font-size:13px;color:#374151"><input type="checkbox" id="bNum"> 仅显示有公开数字的榜单</label></div>
    </div>
    <div class="note">⚠️ 口径：<b>每个数据集是独立评测，跨数据集/跨模型不可直接比较</b>。同一数据集下仅列入官方公开了数字的模型并按方向排序（★ 为该数据集最优）；未公开统一数字的以「官方宣称」标签单列、<b>不参与排序</b>。数字来源：论文/技术报告或榜单/发布页，已在卡片注明。仅当同数据集≥2 个公开数字时才排序标★，单一结果只标注「已收录结果」、不作排名。</div>
    <div class="grid g2">${cards}</div>
    <p class="stat">点击模型名可进入该模型的论文精读卡片。</p>
  `;
  $("#bDom").value=benchState.domain;$("#bDom").onchange=e=>{benchState.domain=e.target.value;renderBench();};
  $("#bNum").checked=benchState.onlyNum;$("#bNum").onchange=e=>{benchState.onlyNum=e.target.checked;renderBench();};
}

/* ---------- 能力维度矩阵 ---------- */
function capsOf(m){
  // P1-9：能力维度改为读取每个模型卡的显式 caps 字段（在 data/kb.js 中人工标注/修订），
  // 不再在渲染时靠摘要关键词猜测。缺失时回落空对象（矩阵显示"—"）。
  return (m && m.caps) || {};
}
function renderMatrix(){
  const cols=[
    {k:"pdf",t:"本地论文"},
    {k:"open",t:"开源可复现"},
    {k:"stream",t:"流式/低延迟"},
    {k:"long",t:"长音频"},
    {k:"multi",t:"多语种/方言"},
    {k:"clone",t:"零样本克隆"},
    {k:"emot",t:"情感/表现力"},
  ];
  const rows=KB.models.map(m=>{
    const c=capsOf(m);
    const open=openStatus(m);
    const cells={
      pdf:   m.pdf_local?"✓":"—",
      open:  open==="Open"?"✓":(open==="Mixed"?"~":"—"),
      stream:c.stream?"✓":"—",
      long:  c.long?"✓":"—",
      multi: c.multi?"✓":"—",
      clone: c.clone?"✓":"—",
      emot:  c.emot?"✓":"—",
    };
    return {m,cells};
  });
  const head=`<th>模型</th><th>领域</th>`+cols.map(c=>`<th>${c.t}</th>`).join("");
  const body=rows.map(r=>{
    const m=r.m;
    return `<tr>
      <td><a class="link" href="#/model/${m.id}">${esc(m.name)}</a></td>
      <td>${domTag(m.domain)}</td>
      ${cols.map(c=>`<td class="c${r.cells[c.k]==='✓'?'y':(r.cells[c.k]==='~'?'m':'n')}">${r.cells[c.k]}</td>`).join("")}
    </tr>`;
  }).join("");
  app.innerHTML=`
    <a class="back" href="#/">← 返回概览</a>
    <h1>能力维度矩阵</h1>
    <div class="note">🧭 矩阵由每个模型卡的<b>显式 caps 字段</b>标注（在 data/kb.js 中人工修订），不再靠摘要关键词实时猜测。✓=具备，—=未标注/不具备，~=混合/有限开放。能力维度如需精修，直接改 data/kb.js 中对应模型的 <code>caps</code> 即可。</div>
    <div style="overflow-x:auto">
    <table class="rtable matrix">
      <thead><tr>${head}</tr></thead>
      <tbody>${body}</tbody>
    </table>
    </div>
    <p class="stat">共 ${rows.length} 个模型。点击模型名进入精读卡片。</p>
  `;
  window.scrollTo(0,0);
}
$("#globSearch").addEventListener("input",e=>{
  const q=e.target.value.trim();
  if(q){modelFilter.q=q;if(location.hash!=="#/models")location.hash="#/models";else renderModels();}
  else{modelFilter.q="";if(location.hash!=="#/models")location.hash="#/models";else renderModels();}
});
router();
</script>
