    { q:`VALL-E emerges in-context learning capabilities and can be used to synthesize high-quality personalized speech with only a 3-second enrolled recording of an unseen speaker as an acoustic prompt.`, src:`arXiv:2301.02111 摘要`, insight:`3 秒提示即可克隆未见过的说话人，说明模型学到的是**通用的「内容+说话人」条件映射**而非特定说话人过拟合。这一 zero-shot 能力直接催生了后续 Voicebox、NaturalSpeech 系列「语音版 GPT」的研究浪潮。` },
    { q:`Instead of designing a complex and specific network for this problem, the ultimate solution is to train a model with large and diverse data as much as possible, motivated by success in the field of text synthesis.`, src:`arXiv:2301.02111 引言`, insight:`作者明确把「大力出奇迹」作为方法论信条：**数据规模（60K 小时）而非网络精巧度**是零样本泛化的根本。这与 GPT 系的成功逻辑一致，但也暗示后续工作的瓶颈会从模型结构转移到数据清洗与版权合规。` },
    { q:`Synthesis robustness: We observe that some words may be unclear, missed, or duplicated in speech synthesis. It is mainly because the phoneme-to-acoustic language part is an autoregressive model, in which disordered attention alignments exist and no constraints to solving the issue.`, src:`arXiv:2301.02111 结论`, insight:`AR 解码的**注意力对齐混乱**是漏读/重复的根因，且论文承认无显式约束可解。这恰恰点明了 VALL-E 类自回归 codec LM 的工程短板，也成为后续 E2-TTS、MaskGCT 等转向完全非自回归路线的直接动机。` },
    { q:`据公开信息/架构可知的推导论点：VALL-E 以 60K 小时「音频+ASR 转写」为训练前提，其 zero-shot 表现高度依赖提示音频质量，而 AR 注意力错位使长句更易丢字或重复，工程落地通常需要后处理或 NAR 修正。`, src:`推导（依据 arXiv:2301.02111 摘要）`, insight:`从架构看，VALL-E 的稳健性短板并非偶然 bug，而是**自回归逐 token 生成对长序列对齐缺乏全局约束**的固有代价。因此它在短句、朗读类场景惊艳，但在口语长句、同音词密集场景更易翻车，落地时必须配合护栏或改用非自回归解码。` }
  ],
  "voicebox": [
    { q:`Voicebox is a non-autoregressive flow-matching model trained to infill speech, given audio context and text, trained on over 50K hours of speech that are neither filtered nor enhanced.`, src:`arXiv:2306.15687 摘要`, insight:`Voicebox 用 **flow-matching 做语音 infill（填空）** 而非自回归逐 token 生成，且直接用 50K 小时「未过滤未增强」的真实野数据训练。这既规避了 AR 的延迟与对齐问题，也证明脏数据规模本身就能换来强泛化，不必过度清洗。` },
    { q:`Voicebox outperforms the state-of-the-art zero-shot TTS model VALL-E on both intelligibility (5.9% vs 1.9% word error rates) and audio similarity (0.580 vs 0.681) while being up to 20 times faster.`, src:`arXiv:2306.15687 摘要`, insight:`论文给出硬指标：相比 VALL-E，**词错率 1.9% 对 5.9%、相似度 0.681 对 0.580、速度快至多 20 倍**。这组数字几乎同时击中 AR 路线的质量、相似度与延迟三处软肋，是 NAR 语音生成里程碑式的结果。` },
    { q:`To give a concrete example, the model can answer a question like, "What is the capital of Japan?" with an example of such a relationship in the context: "The capital of Germany is Berlin. The capital of Japan is".`, src:`arXiv:2306.15687 引言`, insight:`作者借 GPT 的 few-shot 类比来解释 in-context learning：**把语音合成也建模成「补全缺失数据」的通用任务**。这种统一视角让同一模型能不经微调就兼做 TTS、去噪、编辑、风格转换，是「通用语音模型」设想的雏形。` },
    { q:`Hence, scale and diversity are the most crucial factors for building general-purpose models, as we see the state-of-the-art (SOTA) language and vision-language models are trained on web-scale data with billions to hundreds of billions of parameters.`, src:`arXiv:2306.15687 引言`, insight:`这句话把语音模型落后的原因归结为**规模与多样性不足**而非方法缺陷。它既是 Voicebox 的设计纲领，也预言了后续 TTS 竞赛会沿着「更大野数据 + 更大流匹配模型」的轴线展开。` },
    { q:`Previous works consider highly curated datasets such as VCTK, which contains only clean audio recorded in studio from about 100 speakers with little speaking style and text variation. Such models struggle to synthesize speech with rich variation in emotion, voice, background noise, acoustic condition.`, src:`arXiv:2306.15687 引言`, insight:`点名批评「百人干净录音室数据」的天花板：**风格与文本多样性太窄**，模型学不出真实世界的情感、噪声与声学条件变化。这从需求侧解释了为何必须用 in-the-wild 大数据，而非继续精雕小数据集。` }
  ],
  "natural_speech3": [
    { q:`Motivated by it, we propose NaturalSpeech 3, a TTS system with novel factorized diffusion models to generate natural speech in a zero-shot way.`, src:`arXiv:2403.03100 摘要`, insight:`NaturalSpeech 3 的核心主张是用**分解式扩散模型**把复杂语音拆开逐个子空间生成。相较于把整段波形当黑箱，这种「分而治之」思路更利于可控合成，是 NS 系列从 NS2 的单一 latent 扩散走向结构化生成的关键转折。` },
    { q:`Specifically, 1) we design a neural codec with factorized vector quantization (FVQ) to disentangle speech waveform into subspaces of content, prosody, timbre, and acoustic details; 2) we propose a factorized diffusion model to generate attributes in each subspace following its corresponding prompt.`, src:`arXiv:2403.03100 摘要`, insight:`FVQ 把语音解耦为 **content / prosody / timbre / detail 四个子空间**，再用各自的扩散模型按提示生成。这种「先解耦、后生成」的设计让音色、韵律、细节可被独立控制，是后续语音编辑与风格迁移工作的重要基石。` },
    { q:`With this factorization design, NaturalSpeech 3 can effectively and efficiently model intricate speech with disentangled subspaces in a divide-and-conquer way.`, src:`arXiv:2403.03100 摘要`, insight:`作者强调分解式设计带来**效率与效果的双重收益**：各子空间维度低、目标单一，扩散模型更易收敛。但这也意味着解耦质量上限由 FVQ 码本容量决定，子空间一旦耦合就会在生成时串扰。` },
    { q:`Furthermore, we achieve better performance by scaling to 1B parameters and 200K hours of training data.`, src:`arXiv:2403.03100 摘要`, insight:`明确的规模化结论：**1B 参数 + 200K 小时**继续带来质量提升，说明 TTS 仍处在数据/参数未饱和区间。需要注意的是，200K 小时远超市面多数开源可复现数据集，其门槛更多是工程与合规而非算法。` },
    { q:`Since our model could synthesize speech with great speaker similarity, it may carry potential risks in misuse of the model, such as spoofing voice identification or impersonating a specific speaker.`, src:`arXiv:2403.03100 结论`, insight:`论文罕见地在正文直面**声纹伪造与冒用风险**，承认高相似度克隆是一把双刃剑。这反映出 2024 年 TTS 研究共同体的责任意识提升，也为后续合成语音检测、水印等防御工作提供了动机。` },
    { q:`据公开信息/架构可知的推导论点：NaturalSpeech 3 将语音解耦为 content/prosody/timbre/detail 多个子空间，理论上便于独立控制，但各子空间重建保真度受 FVQ 码本容量与训练数据覆盖率制约，极端音色或低资源语种可能仍出现耦合串扰。`, src:`推导（依据 arXiv:2403.03100 摘要）`, insight:`分解式 codec 的假设是「各属性可线性解耦」，但真实语音中音色与韵律高度纠缠，**理想解耦往往需要极大码本与极广覆盖**才能真正成立。因此 NS3 在常见英文说话人上表现优异，但跨语种、跨方言的泛化仍是待验证项。` }
  ],
  "audiobox": [
    { q:`This paper presents Audiobox, a unified model based on flow-matching that is capable of generating various audio modalities. We design description-based and example-based prompting to enhance controllability and unify speech and sound generation paradigms.`, src:`arXiv:2312.15821 摘要`, insight:`Audiobox 用 flow-matching 把**语音、音效、音乐统一到一个模型**，并以「描述式 + 示例式」双提示增强可控性。它的野心不在单一任务 SOTA，而在打通多模态音频生成的统一接口，是 AudioGen 之后「音频版统一模型」的代表作。` },
    { q:`Audiobox sets new benchmarks on speech and sound generation (0.745 similarity on Librispeech for zero-shot TTS; 0.77 FAD on AudioCaps for text-to-sound) and unlocks new methods for generating audio with novel vocal and acoustic styles.`, src:`arXiv:2312.15821 摘要`, insight:`给出可引用指标：zero-shot TTS 相似度 **0.745**、text-to-sound FAD **0.77**。这些基准说明统一模型并未以牺牲单任务质量为代价，反而因为多模态共享表征获得更丰富的风格空间。` },
    { q:`We further integrate Bespoke Solvers, which speeds up generation by over 25 times compared to the default ODE solver for flow-matching, without loss of performance on several tasks.`, src:`arXiv:2312.15821 摘要`, insight:`**Bespoke Solvers 把流匹配采样加速 25 倍以上且不掉点**，是面向部署的关键工程贡献。它揭示了一个常被忽视的事实：流匹配推理的 ODE 求解器本身才是延迟大头，定制求解器比换 backbone 更划算。` },
    { q:`While the in-context style transfer paradigm is powerful, it also possesses several limitations in terms of controllability. First, audio prompt is the only input mechanism of controlling the audio style.`, src:`arXiv:2312.15821 结论`, insight:`作者坦诚示例式提示的局限：**只能靠一段音频提示来控制风格**，用户无法用自然语言精确指定。这恰恰是 Audiobox 同时引入描述式提示的根本原因——纯 in-context 范式在产品化可控性上不够用。` },
    { q:`Second, disentangled style control is not enabled with the paradigm, where voice and other attributes, such as emotion and acoustic condition, can be controlled independently.`, src:`arXiv:2312.15821 结论`, insight:`第二个局限是**音色与情感/声学条件无法解耦独立控制**。这意味着示例式迁移会把提示音频里的所有属性一股脑复制过来，难以「换音色保情感」或「保音色换环境」，制约了细粒度创作。` },
    { q:`据公开信息/架构可知的推导论点：Audiobox 的 in-context 风格迁移范式以音频提示为唯一控制入口，难以像文本提示那样精确解耦音素、情感与声学条件，因此面向产品化可控语音时仍需辅以描述式提示或显式解耦模块。`, src:`推导（依据 arXiv:2312.15821 摘要）`, insight:`从控制论角度看，示例式提示是「整体风格克隆」而非「维度解耦」，**可控性的上界由提示音频本身决定**。要支持「年轻男性、开心、礼堂」这类组合式指令，必须引入自然语言条件或正交风格编码，这正是 Audiobox 描述式分支的补偿逻辑。` }
  ],
  "e2_tts": [
    { q:`This paper introduces Embarrassingly Easy Text-to-Speech (E2 TTS), a fully non-autoregressive zero-shot text-to-speech system that offers human-level naturalness and state-of-the-art speaker similarity and intelligibility.`, src:`arXiv:2406.18009 摘要`, insight:`E2-TTS 把「完全非自回归零样本 TTS」做到人类级自然度，标题 **Embarrassingly Easy** 点明其哲学：不靠复杂组件，靠把问题框定成「音频填空」即可。它验证了 NAR 路线不仅能追上、还能超越 AR 路线的相似度与可懂度。` },
    { q:`In the E2 TTS framework, the text input is converted into a character sequence with filler tokens. The flow-matching-based mel spectrogram generator is then trained based on the audio infilling task.`, src:`arXiv:2406.18009 摘要`, insight:`其巧妙处在于**用 filler token 把文本 pad 到与语音等长**，再训练流匹配模型做 mel 谱的 infill。这样文本-语音对齐不再需要外部对齐器或时长模型，长度对齐在填充过程中被隐式解决，极大简化了流水线。` },
    { q:`Unlike many previous works, it does not require additional components (e.g., duration model, grapheme-to-phoneme) or complex techniques (e.g., monotonic alignment search).`, src:`arXiv:2406.18009 摘要`, insight:`去掉时长模型、G2P、单调对齐搜索后，**系统组件显著减少、工程脆弱点随之消失**。这正是「尴尬地简单」的实操含义：少一个显式模块，就少一处可能出错或需调参的环节。` },
    { q:`One of our findings in this paper is that such techniques are not necessary to achieve high-quality zero-shot TTS, and they are sometimes even harmful to naturalness.`, src:`arXiv:2406.18009 引言`, insight:`作者给出一个反直觉结论：**显式对齐/时长模块有时反而损害自然度**。这挑战了当时 NAR 模型「必须单调对齐或 MAS」的共识，为后续 F5-TTS、Seed-TTSDiT 等端到端无对齐路线提供了理论支撑。` },
    { q:`because the codec token needs to be sampled sequentially, it inevitably increases the inference latency.`, src:`arXiv:2406.18009 结论`, insight:`这句话虽在讲 AR 路线的代价，却也是 E2-TTS 的立论动机：**逐 token 串行采样必然拖慢推理**。E2-TTS 用并行去噪直接消除该瓶颈，呼应了 Voicebox 对 AR 延迟的批判。` },
    { q:`a dedicated effort to figure out the best tokenizer (both for text tokens and audio tokens) is necessary to achieve the best quality.`, src:`arXiv:2406.18009 结论`, insight:`即便转向 NAR，codec/文本 tokenizer 的选择仍是质量天花板：**tokenizer 不到位，模型结构再优也白搭**。这提示从业者，在追求生成模型创新前，先把音频 codec 与文本表征打磨好，往往收益更大。` }
  ],
  "f5_tts": [
    { q:`This paper introduces F5-TTS, a fully non-autoregressive text-to-speech system based on flow matching with Diffusion Transformer (DiT).`, src:`arXiv:2410.06885 摘要`, insight:`F5-TTS 把 **flow matching 与 Diffusion Transformer (DiT)** 结合做完全非自回归 TTS。DiT 的引入让长序列建模具备更强的可扩展性，也顺应了视觉生成里 DiT 取代 U-Net 的趋势，是 TTS backbone 现代化的一次明确迁移。` },
    { q:`Without requiring complex designs such as duration model, text encoder, and phoneme alignment, the text input is simply padded with filler tokens to the same length as input speech, and then the denoising is performed for speech generation, which was originally proved feasible by E2 TTS.`, src:`arXiv:2410.06885 摘要`, insight:`F5-TTS 直接继承 E2-TTS 的 **filler-token 对齐范式**，并坦承可行性由 E2-TTS 证明。其价值不在发明范式，而在把它做「好用」：用 ConvNeXt 精炼文本表征以加速收敛、提升稳健性。` },
    { q:`We further propose an inference-time Sway Sampling strategy, which significantly improves our model's performance and efficiency. This sampling strategy for flow step can be easily applied to existing flow matching based models without retraining.`, src:`arXiv:2410.06885 摘要`, insight:`**Sway Sampling 是即插即用的推理期技巧**，无需重训就能提升其他流匹配 TTS 的质量与效率。这种「不改训练只改采样」的低成本增益，对社区特别友好，体现了工程巧思大于算力堆砌的思路。` },
    { q:`Our design allows faster training and achieves an inference RTF of 0.15, which is greatly improved compared to state-of-the-art diffusion-based TTS models.`, src:`arXiv:2410.06885 摘要`, insight:`**RTF 0.15** 意味着推理速度远超实时，且训练也更省。对流匹配类模型而言，瓶颈常在 ODE 步数与 DiT 计算，F5 通过 ConvNeXt 表征与 Sway Sampling 把两者同时压下，是实用部署向的重要信号。` },
    { q:`Trained on a public 100K hours multilingual dataset, our F5-TTS exhibits highly natural and expressive zero-shot ability, seamless code-switching capability, and speed control efficiency.`, src:`arXiv:2410.06885 摘要`, insight:`**公开 100K 小时多语种数据 + 开源代码/权重**是 F5-TTS 影响力大的主因：可复现、可多语种、可代码切换。它把前沿 NAR TTS 从论文结果变成社区可玩工具，加速了相关研究扩散。` },
    { q:`the inherent limitations of AR modeling require extra efforts addressing issues such as inference latency and exposure bias.`, src:`arXiv:2410.06885 结论`, insight:`作者再次点明 AR 的**推理延迟与曝光偏差**两大硬伤。F5-TTS 的整套设计都可视为对这两点的规避：并行去噪消除延迟，无自回归依赖消除训练-推理不匹配带来的曝光偏差。` }
  ],
  "maskgct": [
    { q:`In this paper, we introduce Masked Generative Codec Transformer (MaskGCT), a fully non-autoregressive TTS model that eliminates the need for explicit alignment information between text and speech supervision, as well as phone-level duration prediction.`, src:`arXiv:2409.00750 摘要`, insight:`MaskGCT 的卖点是**彻底去掉文本-语音显式对齐与音素级时长预测**。它借 mask-and-predict 范式让时长被「隐式」建模，既保留了 NAR 的并行速度，又避免了 diffusion/flow 路线对对齐信息的依赖，是 NAR TTS 结构上的新分支。` },
    { q:`MaskGCT is a two-stage model: in the first stage, the model uses text to predict semantic tokens extracted from a speech self-supervised learning (SSL) model, and in the second stage, the model predicts acoustic tokens conditioned on these semantic tokens.`, src:`arXiv:2409.00750 摘要`, insight:`两阶段 **T2S（文本→语义 token）+ S2A（语义→声学 token）** 把「说什么」与「怎么发声」解耦。语义 token 来自 SSL 模型而非 k-means，使信息损失更小，也让人能分别控制内容语义与声学风格。` },
    { q:`Experiments with 100K hours of in-the-wild speech demonstrate that MaskGCT outperforms the current state-of-the-art zero-shot TTS systems in terms of quality, similarity, and intelligibility.`, src:`arXiv:2409.00750 摘要`, insight:`在 **100K 小时野数据** 上取得质量/相似度/可懂度的全面领先，说明 masked generative transformer 在语音域的潜力不输 AR 与扩散。它也为「语音基础模型」提供了除自回归外的另一条可扩展路径。` },
    { q:`NAR-based models, typically based on diffusion, flow matching, or GAN, require explicit text and speech alignment information as well as the prediction of phone-level duration, resulting in a complex pipeline and producing more standardized but less diverse speech.`, src:`arXiv:2409.00750 引言`, insight:`作者指出主流 NAR 的悖论：**显式对齐换来可控，却牺牲了多样性与自然度**。MaskGCT 想两全——用 mask 迭代解码保留多样性，又靠无对齐训练简化流水线，是对「标准化 vs 生动」权衡的直接回应。` },
    { q:`a text-to-semantic model predicts semantic tokens with text and prompt semantic tokens; a semantic-to-acoustic model predicts acoustic tokens conditioned on semantic tokens; a speech acoustic codec reconstructs waveform from acoustic tokens.`, src:`arXiv:2409.00750 结论`, insight:`框架图 caption 把四件套讲得很清楚：**语义 codec + T2S + S2A + 声学 codec**。这种模块化让 MaskGCT 易于扩展到语音翻译、编辑、变声、情感控制等任务，凸显其作为基础模型的通用性。` },
    { q:`we train a VQ-VAE to quantize speech self-supervised learning embedding, rather than using k-means to extract semantic tokens that is common in previous work. This approach minimizes the information loss of semantic features even with a single codebook.`, src:`arXiv:2409.00750 引言`, insight:`用 **VQ-VAE 替代常见的 k-means** 提取语义 token，是少被注意却关键的设计：单码本下信息损失更小、语义更连续。它解释了为何 MaskGCT 在相似度上能压过依赖 k-means 语义的 SoundStorm 类方案。` }
  ],
  "seed_tts": [
    { q:`We introduce Seed-TTS, a family of large-scale autoregressive text-to-speech (TTS) models capable of generating speech that is virtually indistinguishable from human speech.`, src:`arXiv:2406.02430 摘要`, insight:`Seed-TTS 是工业级 **AR 语言模型 TTS** 的代表，强调「几乎与人类无法区分」。它把规模、数据与后训练工程做到极致，目标不是单一指标 SOTA，而是逼近真人上限的可部署语音基础模型。` },
    { q:`Furthermore, we propose a self-distillation method for speech factorization, as well as a reinforcement learning approach to enhance model robustness, speaker similarity, and controllability.`, src:`arXiv:2406.02430 摘要`, insight:`两大扩展技术很有意思：**自蒸馏做语音因式分解（音色解耦）+ RL 做偏好偏置**。相比改结构或设计特殊 loss，这种「后训练增强」路线更贴合工业迭代——不破坏主干就能持续提升鲁棒性与可控性。` },
    { q:`We additionally present a non-autoregressive (NAR) variant of the Seed-TTS model, named Seed-TTSDiT, which utilizes a fully diffusion-based architecture. Unlike previous NAR-based TTS systems, Seed-TTSDiT does not depend on pre-estimated phoneme durations and performs speech generation through end-to-end processing.`, src:`arXiv:2406.02430 摘要`, insight:`Seed-TTSDiT 用 **端到端扩散** 去掉预估计音素时长，直接预测语音 latent。它证明 NAR 也能达到 AR 路线的水平，且更适合语音编辑——体现团队对两条路线优劣的务实权衡而非押注单一范式。` },
    { q:`We further introduce two novel extension techniques that can significantly enhance model performance: speech factorization via self-distillation and preference biasing through reinforcement learning (RL).`, src:`arXiv:2406.02430 引言`, insight:`把自蒸馏与 RL 称为「novel extension」而非模型本体，透露出**大模型时代 TTS 的竞争力在训练策略与数据**，而非网络结构本身。这种后训练范式与 LLM 的 RLHF/蒸馏如出一辙。` },
    { q:`Under a zero-shot ICL setup, we show that Seed-TTS is able to generate robust, similar, and highly dynamic speech that is indistinguishable from human speech.`, src:`arXiv:2406.02430 结论`, insight:`强调 zero-shot ICL 下语音**稳健、相似且高动态**——"dynamic" 一词点出相比死板朗读，Seed-TTS 更看重韵律活力。这也呼应其情感控制与 in-the-wild 说话人目标，是产品体验导向的指标。` },
    { q:`据公开信息/架构可知的推导论点：Seed-TTS 主流为 AR 语言模型路线，虽经 RL 与自蒸馏提升鲁棒性，但 AR 自回归本质仍可能在极长文本或罕见字词上出现漏读/重复，NAR 的 Seed-TTSDiT 正是为规避此类问题而设。`, src:`推导（依据 arXiv:2406.02430 摘要）`, insight:`AR 与 NAR 双线并推，说明团队清楚 **AR 的漏读/重复是结构性风险**，无法仅靠后训练根除。用 Seed-TTSDiT 覆盖编辑与高风险场景，是一种工程上的风险对冲，而非单纯追求某一路线更优。` }

    { q:`A third frontier has emerged in realtime conversational speech agents, exemplified by GPT-realtime, Gemini Live, and Doubao Realtime, that must understand paralinguistic signals, respond with low latency, preserve persona, and remain emotionally appropriate within an unfolding emotional expression.`, src:`arXiv:2605.23463 引言`, insight:`作者把实时对话语音 agent 列为 TTS 之外的第三战场,强调**副语言信号理解 + 低延迟 + 人设一致性**的复合能力。这提示 TTS 评测不能只看音质,而要纳入延迟与情感合时性。相较 ElevenLabs/Gemini 的强可控路线,该文更看重对话链路里的工程化约束。` },
    { q:`Subjective MOS evaluation also presents significant limitations, as it requires highly trained annotators and often suffers from inconsistencies in scoring criteria across evaluators.`, src:`arXiv:2605.23463 结论`, insight:`MOS 的主观性被点名为核心痛点:**标注员训练成本高且评分标准不一致**。这解释了为何工业界转向 pairwise arena。对读者而言,任何引用绝对 MOS 的论文都应警惕标注口径差异带来的不可比性。` },
    { q:`Considering these limitations, we adopt an arena-style pairwise evaluation framework, in which models are compared via pairwise preference judgments, and their overall performance is measured by aggregated win rates.`, src:`arXiv:2605.23463 结论`, insight:`用**胜率聚合**替代绝对打分,本质是借鉴 LLM 竞技场的相对评估范式。好处是降低标注方差、便于跨模型排位;局限是赢率高度依赖对手池与提示分布。做横向对比时需注意其 arena 构成是否具代表性。` },

    { q:`For MDCT-based diffusion modeling, we first resample the audio to 16 kHz and extract MDCT features using a standard Vorbis window with a length of 320. Due to the overlapped-transform property of MDCT, the hop length is set to half of the window length (i.e., 160), again yielding a frame rate of 100 Hz.`, src:`arXiv:2606.03455 结论`, insight:`同一模型并行支持 **STFT 与 MDCT 双表征**,后者借重叠变换把帧率压到 100Hz。MDCT 在音频编码里久经考验(如 Vorbis/AAC),适合长时相关建模。双表征设计让作者能在质量与效率间做折中,也增加工程复杂度。` },

    { q:`A standard practice when utilizing pretrained language models is to extract the last hidden state as the text representation q.`, src:`arXiv:2603.29339 结论`, insight:`业界默认把**最后一层隐状态**当文本表征,但这篇指出它在 TTS 上并不够好。这挑战了"越大越深的语义表示越优"的直觉。对读者:文本编码器的用法比选哪个模型更关键。` },

const INSIGHTS_PART_I = {
  "fun_realtime_tts": [
    { q:`据公开信息/架构可知的推导论点：Fun-Realtime-TTS 的核心竞争力来自“工程化双流式实时架构 + 大模型基座”，而非单点方法学创新。`, src:`推导（依据知识库 DEEP 文本 / 官方发布）`, insight:`其 bi-streaming 把文本流入与波形流出并行，配合动态注意力控制声调，使首包延迟低至约 128-150ms、合成速度较传统提升约 5 倍，这是面向智能汽车与数字人直播等强时效场景的关键。对比传统全序列生成方案，它把“延迟”作为显式优化项而非事后工程修补。需注意其质量上限仍受 FunAudioLLM 家族 codec-LM 路线约束，延迟优势更多来自流式工程而非新的声学建模范式。` },
    { q:`据公开信息/架构可知的推导论点：其 Artificial Analysis TTS Elo 1190（全球第 5）应被解读为“相对人类偏好排序”而非绝对质量标尺。`, src:`推导（依据知识库 DEEP 文本 / 官方发布）`, insight:`知识库指出该 Elo 是基于盲测成对人类偏好的排序分，Top5 仅差约 24 Elo、竞争高度胶着，且榜单口径（客服/知识分享/数字助手等真实场景）与 HF 开放榜不同，无法直接换算为 WER/SIM。相对 StepAudio 2.5 TTS（约 1187，第 6）差距极小，说明国产实时 TTS 已在同一梯队。建议读者结合自身语种与口音子集与自有数据二次验证，勿把 Elo 当作质量绝对值。` },
    { q:`据公开信息/架构可知的推导论点：该模型的方言与口音覆盖能力（30+ 语言、7 大汉语方言族、20+ 地区口音）是其区别于垂直 TTS 厂商的差异化壁垒。`, src:`推导（依据知识库 DEEP 文本 / 官方发布）`, insight:`中文复杂方言语调一直是 TTS 难点，Fun-Realtime-TTS 把方言/口音纳入统一流式基座，配合指令跟随控制韵律、情绪与音色，利于国内多区域落地。但官方自述“自然度 97%”与真人仍有感知差距，嘈杂环境鲁棒性与大规模商用成本压缩仍是开放问题。横向看，它在中文方言广度上优于多数海外闭源系统，但情感与克隆的绝对上限仍可能被 ElevenLabs、Cartesia 追赶。` },

    { q:`据公开信息/架构可知的推导论点：Fun-Realtime-TTS 的训练哲学以人类偏好对齐（盲测 Elo）为优化目标，而非单纯追求客观指标。`, src:`推导（依据知识库 DEEP 文本 / 官方发布）`, insight:`知识库推测其以 Artificial Analysis Speech Arena 盲测 Elo 为优化锚点，意味着研发资源倾斜于“听感偏好”而非 WER/SIM 等可量化客观分。这种偏好驱动路线能快速逼近真人听感，但也使结果对评测样本分布敏感、跨榜横评需谨慎。对比 Qwen3-TTS 等同时追求 Seed-TTS 客观基准的路线，Fun 更偏“体验优先”的产品化取向。` }
  ],
  "chatterbox_flash": [
    { q:`据公开信息/架构可知的推导论点：Chatterbox-Flash 的本质是“块因果扩散语言模型（block-causal discrete diffusion）”，而非标准 AR 或 NAR。`, src:`推导（依据知识库 DEEP 文本 / 官方发布）`, insight:`它把预训练 AR 解码器微调为分块扩散，块内全位置并行去噪、块间因果流式，是 discrete diffusion / dLLM 在语音上的首次原生流式落地。相比标准 AR（逐 token 延迟随长度线性增长）和标准 NAR（全并行但难保单调对齐），块因果在质量与延迟间取折中。其架构不变即可从已有 Chatterbox-TTS 权重微调，工程代价极低。` },
    { q:`据公开信息/架构可知的推导论点：先验校准评分（PMI）的核心价值是提供“早解码阈值信号”而非直接提升原始质量。`, src:`推导（依据知识库 DEEP 文本 / 官方发布）`, insight:`知识库指出 PMI 用上下文对数概率减去块级边缘对数概率来抑制 codec 长尾/静音 token 偏差，其贡献在于重排 unmask 位置、给出可靠的早解码置信度，而非提升 SIM/UTMOS（TS 调度与之质量相当）。这意味着质量上限仍受原 AR 基座限制，并非结构性超越。但作为轻量推理期技术，它把平均去噪步数从 8 降至 6.47（LibriSpeech-PC）/6.10（Seed-TTS）且 WER 仅 +0.08，是“质量无损省约 20% 步数”的关键证据。` },
    { q:`据公开信息/架构可知的推导论点：其低首包延迟（TTFT）优势受块大小与声码器制约，扩散步数并非唯一瓶颈。`, src:`推导（依据知识库 DEEP 文本 / 官方发布）`, insight:`论文报告 PMI+ED 把步数压低约 24% 并显著降低 RTF，端到端 TTFT 与流式 AR 系统相当，但知识库批判指出早解码节省仍受块大小与 flow-matching 声码器延迟影响。与 Fun-Realtime-TTS 的 bi-streaming 直接压到 128-150ms 相比，Chatterbox-Flash 的延迟优化更偏“解码调度”层面。横向看，它在开源可复现性上优于闭源流式方案，但极长句跨块一致性与情感连贯性仍是挑战。` },
    { q:`据公开信息/架构可知的推导论点：其质量上限受离散 codec token 固有缺陷（量化损失、长尾静音偏向）约束，PMI 仅缓解未根除。`, src:`推导（依据知识库 DEEP 文本 / 官方发布）`, insight:`知识库明示朴素块扩散在离散语音 token 上质量下降的根因是 codec 长尾分布（尤其静音 token）使并行位置偏向少数高频 token，PMI 重排位置只是缓解。对比 Qwen3-TTS 用 12Hz 多码本加 MTP 直接降低帧率、Confucius4-TTS 用 MaskGCT 式语义 codec，Chatterbox-Flash 仍绑定原 Chatterbox 的 25Hz 离散 token，上限受限。评估以 Seed-TTS/LibriSpeech-PC 为主，缺与 Voxtral、StepAudio 2.5 等混合架构的跨范式对比。` },
    { q:`据公开信息/架构可知的推导论点：作为开源社区维护方案，它的最大价值是“用极小代价把已有 AR 权重改造为流式”，降低 dLLM 语音落地门槛。`, src:`推导（依据知识库 DEEP 文本 / 官方发布）`, insight:`不另训架构、仅替换训练目标为 masked denoising 并加免架构修改的推理技术（PMI+ED），使其可复现性强、适配原 Chatterbox 生态。对想研究流式扩散 TTS 的研究者，这是比从头训 NAR 更省力的实验平台。但权重规模与显存需求取决于原 Chatterbox-TTS 基座，且社区维护意味着长期稳定性与多语种扩展依赖志愿者。` }
  ],
  "confucius4_tts": [
    { q:`据公开信息/架构可知的推导论点：Confucius4-TTS 的差异化不在“无文本语义建模”，而在“免参考音频转录（transcript-free）的跨语种克隆”。`, src:`推导（依据知识库 DEEP 文本 / 官方发布）`, insight:`知识库特别批判“textless”标签易误导——它并非 CIF/完全无文本，而是参考音频无需转录、目标语言文本仍是必需输入。真正痛点是野外参考音频常无转录，此能力显著降低部署摩擦。对比 EmotiVoice（仅训练集内音色）、多数需参考文本的零样本模型，其“3 秒免文本克隆 + 14 语跨语种无口音 + 情感跨语种迁移”三位一体更偏易用性。` },
    { q:`据公开信息/架构可知的推导论点：其跨语种可懂度收益有量化支撑（CV3-Eval 六方向平均 WER 3.73%），但音色相似度并非最强项。`, src:`推导（依据知识库 DEEP 文本 / 官方发布）`, insight:`知识库指出该 WER 优于多数需参考文本基线（如 CosyVoice 在 ja→zh 高达 48.10、ko→zh 7.70），证明 transcript-free 设计在跨语种可懂度上确有实际收益。但同榜 SIM 多项低于 VoxCPM2/OmniVoice（中文 SIM 0.765、英文 SIM 0.70），说明音色保真并非其最强维度。横向看，其优势在“免文本加情感迁移”的组合易用性而非绝对克隆质量。` },
    { q:`据公开信息/架构可知的推导论点：其架构从声码器方案升级为 GPT 式 LLM + Flow Matching，且 Apache-2.0 全量开源利于国产化服务端落地。`, src:`推导（依据知识库 DEEP 文本 / 官方发布）`, insight:`流水线为 T2S（LLM 主干生成语义 token，说话人由 Wav2Vec2-BERT 2.0 + ECAPA-TDNN 提取）+ S2A（conditional flow matching 转 mel + BigVGAN 声码器），全程无需参考文本。1.3B 参数、54GB 资源包可本地离线部署，对数据合规敏感的国内场景有价值。但 54GB 包与 1.3B 规模使边缘部署不现实，定位更偏服务端。` },
    { q:`据公开信息/架构可知的推导论点：其跨语种“无口音”与“情感跨语种迁移”是经验性主张，自报指标缺独立验证。`, src:`推导（依据知识库 DEEP 文本 / 官方发布）`, insight:`知识库指出官方自报克隆相似度大于 85%、任务准确度 97% 第三方独立验证有限，无法 100% 复刻细微音色。跨语种无口音（如中文音频输出地道日/英/法）以 CV3-Eval 与内部集佐证，但属经验结论。对比 MiniMax Speech 2.8 的 Sound Tags 体系（显式副语言标签），Confucius4 的情感迁移靠自动提取参考情感，可控性更弱但更自动化。` },
    { q:`据公开信息/架构可知的推导论点：语种覆盖（14 种）少于 Fish-Speech（约 50）、Chatterbox（23），是其规模上的相对短板。`, src:`推导（依据知识库 DEEP 文本 / 官方发布）`, insight:`知识库明确将 14 语列为真实边界，对需要超广语种覆盖的应用不如 Fish-Speech。但其跨语种无口音能力在 14 语范围内质量优于多数需参考文本的基线，是“少而精”的取舍。若业务仅涉主流语种且强调免文本克隆，它是性价比高且可离线的开源选择；若需长尾语种则应考虑 Fish-Speech 系。` }
  ],
  "fishaudio_s2": [
    { q:`据公开信息/架构可知的推导论点：Fish Audio S2 的核心创新是 Dual-AR（Slow AR + Fast AR）解耦，把高保真 44.1kHz 建模成本压到可控。`, src:`推导（依据知识库 DEEP 文本 / 官方发布）`, insight:`Slow AR 用 Qwen3-4B 建模文本与第一码本语义 token 交错序列，Fast AR 仅 4 层轻量 Transformer 按深度重建剩余 9 个 RVQ 码本，配合 Multi-Codebook Fusion 聚合为连续向量。相比传统 codec-LM 一次性预测所有 RVQ 层导致序列爆炸，此解耦兼顾容量与大于 16k 长上下文。这是其相对 VALL-E 类系统的关键区别。` },
    { q:`据公开信息/架构可知的推导论点：其多奖励 GRPO 对齐把语义正确性、声学偏好、说话人相似联合优化，但权重为未充分说明的超参。`, src:`推导（依据知识库 DEEP 文本 / 官方发布）`, insight:`知识库指出奖励 Rtotal = w1*RSTT + w2*RPref + w3*RSIM，分别来自 ASR 置信度、质量模型、声纹余弦相似度，用 rank-stabilized LoRA（r=16, alpha=64）仅微调 MLP 层。消融显示多奖励优于单奖励、且预训练与后训练用同一组奖励模型消除分布偏移。但权重搜索与外部泛化性披露不足，LoRA 仅微调 MLP 可能限制音色空间的大规模塑形。` },
    { q:`据公开信息/架构可知的推导论点：其对外主证据依赖自研基准（Fish Audio Instruction Benchmark、Audio Turing Test），缺乏统一第三方榜完整对比，SOTA 表述偏乐观。`, src:`推导（依据知识库 DEEP 文本 / 官方发布）`, insight:`知识库批判其大量使用自研基准——Audio Turing Test 后验均值 0.483 经指令改写升到 0.515、Instruction Benchmark 标签激活率 93.3%、Emergent TTS Eval 总胜率 81.88%，但缺少与同代系统在 Seed-TTS/CV3-Eval 的完整对比表。Long-TTS-Eval 上最低 WER 验证长音频稳定性（跳词/音色漂移被抑制）是更可信的第三方向证据。读者应把“社区实测克隆质量好”理解为相对 Fish-Speech v1 在指令跟随与长音频稳定性上的提升，而非单纯音质。` },
    { q:`据公开信息/架构可知的推导论点：其 5000 亿 token、80 语、超 1000 万小时的数据规模是社区难以复现的壁垒，但低资源语种仍落后闭源巨头。`, src:`推导（依据知识库 DEEP 文本 / 官方发布）`, insight:`三阶段数据策展（源分离加 VAD、w2v-BERT 2.0 质量过滤、Qwen3-Omni-30B 富转录）与模态交织策略是其质量基础，但按语种细分的规模披露缺失。知识库指出训练数据小于 1000 小时的低资源语言仍落后于 ElevenLabs，且 8B 级总参（4B Slow 加轻量 Fast 加 codec）推理成本高于小模型。RTF 0.195、TTFA 小于 100ms 虽好，但 AR 骨架使超长句首包后仍有逐步生成延迟。` },
    { q:`据公开信息/架构可知的推导论点：其 codec 选择（改进版 DAC，第一码本做 w2v-BERT 2.0 语义蒸馏）是其区别于自研 codec 路线的稳健设计。`, src:`推导（依据知识库 DEEP 文本 / 官方发布）`, insight:`基于 Descript Audio Codec，10 码本、44.1kHz、约 21Hz、446M 参数，加因果卷积支持流式、因果滑动窗口 Transformer 处理长程依赖、第一码本注入语义监督稳定对齐。这比完全自研 codec 更省算力且复用成熟生态。对比 Qwen3-TTS 自研 12Hz/25Hz tokenizer，Fish-S2 更依赖外部 codec 但通过语义蒸馏弥补了离散 token 的对齐漂移。` }
  ],
  "minimax28": [
    { q:`据公开信息/架构可知的推导论点：MiniMax Speech 2.8 的核心差异化是文本内联 Sound Tags 系统，而非基础声学架构。`, src:`推导（依据知识库 DEEP 文本 / 官方发布）`, insight:`据推测其为由 LLM 语义 token 加扩散/流匹配声学或 codec-LM 的混合范式，但关键卖点是把 laugh/breath/cough/yawn 等副语言事件作为文本标记注入，实现无需后处理的细粒度副语言控制。对比 Orpheus 的情绪标签（靠模型涌现演出）和 Higgs v2 的导演式指令，Sound Tags 是显式、可控、列表化的方案。这使其表现力控制强于多数仅做韵律预测的系统。` },
    { q:`据公开信息/架构可知的推导论点：其对外量化证据均为“相对自家旧版本”的代际对比，缺与同期竞品的统一基准横评。`, src:`推导（依据知识库 DEEP 文本 / 官方发布）`, insight:`知识库指出 Together AI 模型卡显示相对 Speech-2.6 盲测自然度失败率降 60%、相对 Speech-2.0 综合听感胜率 54.5%，这些是对内代际对比而非跨厂商基准。盲测把 59% 自然度失败归因到 2.6 版本、在 2.8 解决，提示改进主要来自副语言与停顿建模而非基础 codec 升级。横向看，其 60%/54.5% 数字不能直接与 ElevenLabs、Fish-Speech、Qwen3-TTS 比较，参考需谨慎。` },
    { q:`据公开信息/架构可知的推导论点：10 秒克隆 + 40+ 语言 + 端到端延迟低于 250ms 的定位使其瞄准语音 Agent 与陪伴 NPC 生产部署。`, src:`推导（依据知识库 DEEP 文本 / 官方发布）`, insight:`官方强调亚洲语言一致性与跨语言口音渗透消除（以普通话-日语对起步），高保真克隆仅需 10 秒样本即可捕获音色纹理、气声与语速。TTFT 低于 300ms、全流式合成，契合实时交互场景。但闭源付费 API 不可微调不可复现，语种虽标 40+ 实际低资源语种质量未披露，与 Fun-Realtime-TTS 的工业定位类似但副语言控制更强。` },
    { q:`据公开信息/架构可知的推导论点：Sound Tags 列表固定使其精确内容可控性受标签体系覆盖度制约。`, src:`推导（依据知识库 DEEP 文本 / 官方发布）`, insight:`知识库指出超出现有标签的情绪或动作无法表达，精确可控性依赖标签覆盖度，这比自然语言式指令（如 Qwen3-TTS 的 VoiceDesign）更受限。对比 Higgs v2 的 whisper/gasp 导演指令可组合、Confucius4 的自动情感迁移更自动化，MiniMax 走的是“有限但可靠”的显式标签路线。此外 10 秒克隆的声纹安全与授权边界未充分讨论，商用需注意合规。` },
    { q:`据公开信息/架构可知的推导论点：作为生产优先的闭源系统，其透明度天然低，技术严谨性不可得，社区难以验证亚洲语言一致性等主张。`, src:`推导（依据知识库 DEEP 文本 / 官方发布）`, insight:`无公开论文或架构细节，仅官方博客与 Together AI 模型卡可查，消融实验未发布。知识库批判其定位为生产部署而非研究，论文式严谨不可得。若研究需要可审计的副语言控制，应转向 Orpheus（开源权重）或 Chatterbox-Flash（开源）；若只要稳定可用的表现力 TTS API，MiniMax 2.8 是成熟选择。` }
  ],
  "qwen3_tts": [
    { q:`据公开信息/架构可知的推导论点：Qwen3-TTS 用统一离散多码本 LM 端到端建模全部信息，旁路了传统 LM+DiT 级联的信息瓶颈。`, src:`推导（依据知识库 DEEP 文本 / 官方发布）`, insight:`其双轨 tokenizer（25Hz 单码本语义 + 12Hz 多码本 16 层 RVQ）配合 Talker（28 层 transformer、RoPE、GQA）与 MTP 多 token 预测，把文本与声学 token 沿通道轴连接实现流式。对比语义 token 加扩散声学两阶段方案，端到端离散建模提升 versatility、效率与上限。12Hz 变体首包低至 97ms（0.6B）/101ms（1.7B），是其相对 Qwen-Audio-3.0-TTS 的工程飞跃。` },
    { q:`据公开信息/架构可知的推导论点：MTP 多 token 预测是 12Hz 变体实时性的核心，避免每步跑 16 次全模型。`, src:`推导（依据知识库 DEEP 文本 / 官方发布）`, insight:`知识库消融显示 MTP 并行生成剩余 15 码本，相比逐码本串行显著降延迟且质量持平。这与 Fish-S2 的 Fast AR 思路类似（都解耦语义与声学码本并行），但 Qwen3 用 MTP 而非独立轻量 Transformer。轻量非 DiT 解码器加 12Hz 极低帧率共同验证“极低帧率对延迟的关键作用”，使其对齐 Qwen 生态、与 Qwen-Audio 无缝集成。` },
    { q:`据公开信息/架构可知的推导论点：其已知结果（Seed-TTS 最低 WER、6/10 语言 WER 最优、跨语言 zh 到 ko 错误率降 66%）来自自有评测设置，SOTA 需结合上下文看。`, src:`推导（依据知识库 DEEP 文本 / 官方发布）`, insight:`知识库指出 long-zh WER 1.517、long-en WER 1.225、InstructTTSEval 开源模型 SOTA 等，但缺乏与 Fish-S2/MiniMax/ElevenLabs 在统一榜的逐项绝对值对比。DPO 对齐人类偏好加 GSPO 群体相对策略优化提升任务稳定性，长上下文扩展至 32768 使超 10 分钟长语音 WER 最低。作为评审，我认为其零样本克隆与长语音稳定性确达开源 SOTA 级，但跨厂商横向优势需谨慎外推。` },
    { q:`据公开信息/架构可知的推导论点：12Hz 极低帧率虽降延迟，但在极细腻韵律与高频细节上可能相对高帧率 codec 有损。`, src:`推导（依据知识库 DEEP 文本 / 官方发布）`, insight:`知识库把此列为真实边界——极低帧率压缩信息，相对高帧率 codec 在极细腻韵律与高频细节上可能有损。端到端多码本 LM 把全部信息压入离散 token，对可解释的中间表征（语义与声学分离）控制弱于两阶段方案。对比 Higgs v2 的连续表征、Confucius4 的语义/声学分离流水线，Qwen3 更偏“统一但黑盒”的端到端取向。` },
    { q:`据公开信息/架构可知的推导论点：25Hz 与 12Hz 双变体定位重叠且选型指南不足，易让用户困惑。`, src:`推导（依据知识库 DEEP 文本 / 官方发布）`, insight:`知识库批判两个变体均支持流式、克隆、指令，重叠度高而官方缺少清晰选型指引。25Hz 融合语义与声学（基于 Qwen2-Audio 编码器）在表达力与可建模性间平衡，12Hz 极速低延迟，用户需自行权衡质量-延迟。此外 GSPO 作为较新优化器，其相对 PPO/GRPO 的稳定性收益缺乏充分消融披露；1.7B 部署虽 Apache-2.0 开源但仍需相当算力。` }
  ],
  "orpheus_tts": [

/* ---------- 框架谱系 ---------- */
function lineageSVG(L){
  const W=760, rowH=78, baseY=46, baseX=16, baseW=190, baseH=46;
  const members=L.members;
  const H=Math.max(170, baseY+baseH+30+members.length*rowH+20);
  const memX=440, memW=300, memH=50;
  let edges="", nodes="";
  members.forEach((mb,i)=>{
    const y=baseY+baseH+30+i*rowH;
    const my=y+memH/2, by=baseY+baseH/2;
    edges+=`<path d="M ${baseX+baseW} ${by} C ${(baseX+baseW+memX)/2} ${by}, ${(baseX+baseW+memX)/2} ${my}, ${memX} ${my}" stroke="#cbd5e1" stroke-width="2" fill="none"/>`;
    const mdl=modelsById[mb.model_id];if(!mdl)return;
    const col=mdl.domain==="ASR"?"#1e40af":"#9d174d";
    const lines=wrapText(mb.innovation_point,18);
    const tspan=lines.map((ln,k)=>`<tspan x="${memX+12}" dy="${k===0?0:16}">${esc(ln)}</tspan>`).join("");
    nodes+=`<g>
      <rect x="${memX}" y="${y}" width="${memW}" height="${memH}" rx="10" fill="#fff" stroke="${col}" stroke-width="2"/>
      <text x="${memX+12}" y="${y+20}" font-size="14" font-weight="800" fill="${col}">${esc(mdl.name)}${mb.variant?' <tspan font-size="11" fill="#92400e">('+esc(mb.variant)+')</tspan>':''}</text>
      <text x="${memX+12}" y="${y+38}" font-size="11.5" fill="#475569">${tspan}</text>
      <title>${esc(mdl.name)}｜${esc(mb.innovation_point)}</title>
      <a href="#/model/${mdl.id}"><rect x="${memX}" y="${y}" width="${memW}" height="${memH}" rx="10" fill="transparent" style="cursor:pointer"/></a>
    </g>`;
  });
  const baseNode=`<g><rect x="${baseX}" y="${baseY}" width="${baseW}" height="${baseH}" rx="10" fill="#0f172a"/>
    <text x="${baseX+baseW/2}" y="${baseY+19}" font-size="13" font-weight="800" fill="#fff" text-anchor="middle">基线</text>
    <text x="${baseX+baseW/2}" y="${baseY+37}" font-size="10.5" fill="#cbd5e1" text-anchor="middle">${esc(L.baseline)}</text></g>`;
  return `<svg viewBox="0 0 ${W} ${H}" width="100%" style="min-width:680px">${edges}${baseNode}${nodes}</svg>`;
}

let benchState={domain:"All",onlyNum:false};
function modelName(id){const m=KB.models.find(x=>x.id===id);return m?m.name:id;}
function renderBench(){
  let list=BENCHMARKS.filter(b=>benchState.domain==="All"||b.domain===benchState.domain);
  if(benchState.onlyNum) list=list.filter(b=>b.entries.some(e=>e.v!=null));
  const cards=list.map(b=>{
    const numeric=b.entries.filter(e=>e.v!=null);
    const qual=b.entries.filter(e=>e.v==null);
    let best=null;
    if(numeric.length){ best=(b.better==="lower")?Math.min(...numeric.map(e=>e.v)):(b.better==="higher")?Math.max(...numeric.map(e=>e.v)):null; }
    const maxV=numeric.length?Math.max(...numeric.map(e=>e.v)):1;
    const span=(maxV-Math.min(...numeric.map(e=>e.v)))||1;
    const rows=numeric.slice().sort((a,b)=> (b.better==="lower")? a.v-b.v : b.v-a.v).map(e=>{
      const isBest=(best!=null)&&(e.v===best);
      let goodness = (b.better==="higher") ? (maxV? e.v/maxV : 1) : (span? (maxV-e.v)/span : 1);
      const w=Math.max(6,goodness*100);
      const valTxt=(e.approx?"~":"")+e.v+(b.unit||"");
      return `<div class="bar-row">
        <div class="bar-name" title="${esc(modelName(e.id))}"><a class="link" href="#/model/${e.id}">${esc(modelName(e.id))}</a>${isBest?'<span class="best-star">★</span>':''}</div>
        <div class="bar-track"><div class="bar-fill" style="width:${w}%;${isBest?'background:linear-gradient(90deg,#059669,#10b981)':''}"></div></div>
        <div class="bar-val">${valTxt}</div></div>`;
    }).join("");
    const qtags=qual.map(q=>`<span class="qtag"><a class="link" href="#/model/${q.id}">${esc(modelName(q.id))}</a>：${esc(q.note)}</span>`).join("");
    const dirCls={lower:"dir-lower",higher:"dir-higher",rank:"dir-rank"}[b.better]||"dir-rank";
    const dirText={lower:"越低越好",higher:"越高越好",rank:"官方宣称"}[b.better]||"官方宣称";
    return `<div class="bench-card">
      <h3>${esc(b.name)}<span class="bench-dir ${dirCls}">${dirText}</span></h3>
      <div class="bench-meta">${b.domain} · 指标 ${esc(b.metric)}${b.unit?(" ("+b.unit+")"):""} · ${numeric.length} 个模型有公开数字</div>
      ${rows||'<p class="muted">该数据集暂无公开统一数字。</p>'}
      ${qtags?`<div class="qline">${qtags}</div>`:""}
    </div>`;
  }).join("");
  app.innerHTML=`
    <a class="back" href="#/">← 返回概览</a>
    <h1>横评 Benchmark（按数据集）</h1>
    <div class="filters">
      <div><label>领域</label><select id="bDom"><option value="All">全部</option><option value="ASR">ASR</option><option value="TTS">TTS</option></select></div>
      <div style="display:flex;align-items:flex-end"><label style="display:flex;gap:6px;align-items:center;font-size:13px;color:#374151"><input type="checkbox" id="bNum"> 仅显示有公开数字的榜单</label></div>
    </div>
    <div class="note">⚠️ 口径：<b>每个数据集是独立评测，跨数据集/跨模型不可直接比较</b>。同一数据集下仅列入官方公开了数字的模型并按方向排序（★ 为该数据集最优）；未公开统一数字的以「官方宣称」标签单列、<b>不参与排序</b>。数字来源：论文/技术报告或榜单/发布页，已在卡片注明。</div>
    <div class="grid g2">${cards}</div>
    <p class="stat">点击模型名可进入该模型的论文精读卡片。</p>
  `;
  $("#bDom").value=benchState.domain;$("#bDom").onchange=e=>{benchState.domain=e.target.value;renderBench();};
  $("#bNum").checked=benchState.onlyNum;$("#bNum").onchange=e=>{benchState.onlyNum=e.target.checked;renderBench();};
}
$("#globSearch").addEventListener("input",e=>{
  const q=e.target.value.trim();
  if(q){modelFilter.q=q;if(location.hash!=="#/models")location.hash="#/models";else renderModels();}
  else{modelFilter.q="";}
});
